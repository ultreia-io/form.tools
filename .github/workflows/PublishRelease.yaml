name: Publish Release

# Merging a checked release PR starts publication.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      commit: ${{ github.event.pull_request.merge_commit_sha }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Check out merged release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Find the successful Start Release run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          tag=${RELEASE_BRANCH#release/}
          package=$(awk '$1 == "Package:" { print $2; exit }' DESCRIPTION)
          version=$(awk '$1 == "Version:" { print $2; exit }' DESCRIPTION)
          checked_tree=$(gh api "repos/$GH_REPO/git/commits/$RELEASE_HEAD" --jq '.tree.sha')
          if [[ -z "$package" || "$version" != "$tag" || "$checked_tree" != "$(git rev-parse HEAD^{tree})" ]]; then
            echo '::error::The merged files differ from the release candidate. Run Start Release for the updated files.'
            exit 1
          fi

          # A maintainer can merge just before the PR creation job records its success.
          for attempt in {1..6}; do
            run_id=$(gh api --method GET "repos/$GH_REPO/actions/workflows/StartRelease.yaml/runs" \
              -f branch=develop -f event=workflow_dispatch -f head_sha="$RELEASE_HEAD" -f status=success \
              -F per_page=1 --jq '.workflow_runs[0].id // empty')
            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo '::error::No successful Start Release run matched this release commit.'
            exit 1
          fi
          {
            echo "run-id=$run_id"
            echo "tag=$tag"
            echo "archive=${package}_${tag}.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Download the checked release files
        uses: actions/download-artifact@v8.0.2
        with:
          name: checked-release
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}

      - name: Verify the checked archive
        working-directory: build
        shell: bash
        env:
          RELEASE_ARCHIVE: ${{ steps.candidate.outputs.archive }}
        run: |
          sha256sum "$RELEASE_ARCHIVE" | cmp - SHA256SUMS

      - name: Upload checked coverage for the merged commit
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          override_commit: ${{ github.event.pull_request.merge_commit_sha }}
          override_branch: main
          files: build/coverage.xml
          plugins: noop
          disable_search: true
          fail_ci_if_error: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.candidate.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          files: |
            build/${{ steps.candidate.outputs.archive }}
            build/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true

  # Repositories opt in to CRAN submission after a successful publication.
  cran:
    name: Submit to CRAN
    needs: publish
    if: vars.SUBMIT_TO_CRAN == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      # Release assets survive reruns; an unfinished attempt must be reviewed before retrying.
      - name: Check previous CRAN submission
        id: submission
        shell: bash
        run: |
          release_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -qx 'CRAN-SUBMITTED.txt' <<< "$release_assets"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already submitted to CRAN; no upload repeated." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qx 'CRAN-SUBMISSION-STARTED.txt' <<< "$release_assets"; then
            echo "::error::Previous CRAN attempt has no receipt. Check its run and CRAN email before retrying."
            exit 1
          fi
      - name: Check out released sources
        if: steps.submission.outputs.skip != 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
      - name: Set up R
        if: steps.submission.outputs.skip != 'true'
        uses: r-lib/actions/setup-r@v2.14.0
        with:
          use-public-rspm: true
      - name: Install libcurl development files
        if: steps.submission.outputs.skip != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config
      - name: Install submission tools
        if: steps.submission.outputs.skip != 'true'
        shell: Rscript {0}
        run: |
          install.packages(c("xfun", "curl"), repos = "https://cloud.r-project.org")
          # Installation failures can be warnings; require loadable tools before reserving an upload.
          library(xfun)
          library(curl)
      - name: Download and verify the release archive
        if: steps.submission.outputs.skip != 'true'
        shell: bash
        run: |
          package=$(awk '$1 == "Package:" { print $2; exit }' "$GITHUB_WORKSPACE/DESCRIPTION")
          archive="${package}_${RELEASE_TAG}.tar.gz"
          mkdir -p "$RUNNER_TEMP/cran-release"
          gh release download "$RELEASE_TAG" --pattern "$archive" --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/cran-release"
          cd "$RUNNER_TEMP/cran-release"
          sha256sum "$archive" | cmp - SHA256SUMS
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          if [[ -f "$GITHUB_WORKSPACE/cran-comments.md" ]]; then
            cp "$GITHUB_WORKSPACE/cran-comments.md" .
          fi
      # Reserve the attempt before uploading; never overwrite this duplicate guard.
      - name: Record CRAN submission attempt
        if: steps.submission.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/cran-release
        shell: bash
        run: |
          cp SHA256SUMS CRAN-SUBMISSION-STARTED.txt
          printf '\nWorkflow: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$GITHUB_RUN_ID" \
            >> CRAN-SUBMISSION-STARTED.txt
          gh release upload "$RELEASE_TAG" CRAN-SUBMISSION-STARTED.txt
      - name: Submit the existing archive with xfun
        if: steps.submission.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/cran-release
        shell: bash
        run: |
          Rscript -e 'xfun::submit_cran(file = Sys.getenv("RELEASE_ARCHIVE"), sync = FALSE)' 2>&1 | tee submission.log
          # xfun can report an unsuccessful submission without raising an R error.
          grep -Fq 'The package has been submitted.' submission.log
          cp CRAN-SUBMISSION-STARTED.txt CRAN-SUBMITTED.txt
          gh release upload "$RELEASE_TAG" CRAN-SUBMITTED.txt
          echo "Submitted to CRAN. Confirm the email sent to the package maintainer." >> "$GITHUB_STEP_SUMMARY"

  # Deploy documentation from the same commit once the GitHub release is available.
  website:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/Website.yaml
    with:
      ref: ${{ needs.publish.outputs.commit }}
    secrets: inherit
