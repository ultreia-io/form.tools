name: Start Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/Build.yaml
    with:
      ref: ${{ github.sha }}
      all_platforms: true
      release: true
    secrets: inherit

  prepare:
    name: Open release pull request
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the checked candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Open the release pull request
        shell: bash
        run: |
          package=$(awk '$1 == "Package:" { print $2; exit }' DESCRIPTION)
          version=$(awk '$1 == "Version:" { print $2; exit }' DESCRIPTION)
          if [[ -z "$package" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            ! grep -Fxq "# $package $version" NEWS.md; then
            echo '::error::Prepare a stable version in DESCRIPTION and a matching NEWS.md heading.'
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$version" > /dev/null; then
            echo "::error::Tag $version already exists."
            exit 1
          fi

          # Merge only the files that passed the four checks. Fetch main again after the long checks.
          git fetch --no-tags origin main
          if ! merge_tree=$(git merge-tree --write-tree FETCH_HEAD "$RELEASE_COMMIT") ||
            [[ "$merge_tree" != "$(git rev-parse "$RELEASE_COMMIT^{tree}")" ]]; then
            echo '::error::Merging into main would change the checked files. Update develop and run Start Release again.'
            exit 1
          fi

          # Create the release branch at the exact checked SHA. A retry may advance it by fast-forward.
          release_branch="release/$version"
          branch_head=$(git ls-remote origin "refs/heads/$release_branch" | cut -f1)
          if [[ -z "$branch_head" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/heads/$release_branch" -f sha="$RELEASE_COMMIT" > /dev/null
          elif [[ "$branch_head" != "$RELEASE_COMMIT" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/heads/$release_branch" \
              -f sha="$RELEASE_COMMIT" -F force=false > /dev/null
          fi

          pull_request=$(gh pr list --head "$release_branch" --base main --state open \
            --json url --jq '.[0].url // empty')
          if [[ -z "$pull_request" ]]; then
            pull_request=$(gh pr create --head "$release_branch" --base main --label release \
              --title "Release $version" \
              --body "All four environments passed in [Start Release]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID).")
          fi
          echo "Release pull request: $pull_request" >> "$GITHUB_STEP_SUMMARY"
