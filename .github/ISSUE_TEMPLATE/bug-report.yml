name: Bug report
description: Report a reproducible form.tools problem
assignees: [ultreiaio]
labels: ["type::bug", "priority::normal", "status::new"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Offline synthetic reproduction
      description: Include package version, model configuration, expected behaviour, and diagnostics. Remove private data.
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: R session information
